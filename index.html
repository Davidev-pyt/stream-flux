<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Stream Flux</title>
</head>
    <!-- NAVBAR PREMIUM COM BARRA DE PESQUISA (StreamFlux 2.0) -->
   <nav class="w-full bg-gradient-to-b from-zinc-950/90 via-zinc-950/40 to-transparent px-8 md:px-16 py-4 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-0 z-40 transition-all duration-500">     
        <!-- Logo e Links -->
        <div class="flex items-center gap-8">
            <span class="text-2xl font-extrabold tracking-tighter text-red-600 uppercase cursor-pointer">StreamFlux</span>
            <div class="hidden md:flex gap-6 text-sm font-medium text-zinc-400">
                <a class="hover:text-white transition-colors cursor-pointer">Início</a>
                <a class="hover:text-white transition-colors cursor-pointer">Séries</a>
                <a class="hover:text-white transition-colors cursor-pointer">Filmes</a>
                <a class="hover:text-white transition-colors cursor-pointer">Bombando</a>
            </div>
        </div>

        <!-- BARRA DE PESQUISA COM LUPA REATIVA -->
        <div class="relative w-full md:w-80 flex items-center">
            <!-- Input de Texto -->
            <input type="text" id="input-busca" placeholder="Títulos, gêneros, atores..." 
                   class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-full px-5 py-2 text-sm focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 placeholder-zinc-500 transition-all">
            
            <!-- Botão de Lupa (Ícone SVG Minimalista) -->
            <button id="btn-busca" class="absolute right-4 text-zinc-400 hover:text-red-600 transition-colors cursor-pointer" title="Buscar Filme">
                <svg xmlns="http://w3.org" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </button>
        </div>
    </nav>

<body class="bg-zinc-950 text-white min-h-screen font-sans flex flex-col justify-between overflow-x-hidden">

    <!-- BANNER DINÂMICO DO TOPO (Hero Backdrop) -->
    <section id="hero-banner" class="w-full h-[65vh] relative bg-cover bg-center transition-all duration-700 flex items-end p-8 md:p-16">
        
        <!-- Camada de Degradê para dar contraste nas letras -->
        <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/40 to-transparent"></div>

        <!-- Bloco de texto dentro do banner -->
        <div class="relative z-10 max-w-2xl flex flex-col gap-4">
            <h1 class="text-4xl md:text-6xl font-black uppercase tracking-tight" id="filme-titulo">StreamFlux Original</h1>
            <p class="text-zinc-400 text-sm md:text-base leading-relaxed" id="filme-sinopse">Selecione um filme no carrossel abaixo para começar a assistir.</p>
            <button class="w-fit px-6 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition-transform hover:scale-105 shadow-lg shadow-red-600/20">Assistir</button>
        </div>
    </section>

    <!-- CARROSSEL DE CARDS REATIVOS -->
    <div class="p-8 md:px-16 flex flex-col gap-4 w-full">
        <h2 class="text-xl font-bold tracking-tight text-zinc-200">Tendências Agora</h2>
        <div class="flex gap-4 overflow-x-auto pb-4 scrollbar-none w-full scroll-smooth" id="carrossel-filmes"></div>
    </div>

    <!-- MODAL DO PLAYER DE TRAILER (Nasce escondido com 'hidden') -->
    <div id="modal-player" class="fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4 backdrop-blur-sm hidden">
        
        <!-- CONTAINER PRINCIPAL DO VÍDEO -->
        <div class="relative w-full max-w-4xl bg-zinc-950 rounded-2xl border border-zinc-900 overflow-hidden aspect-video shadow-2xl shadow-red-600/5">
            
            <!-- BOTÃO FECHAR -->
            <button id="btn-fechar" class="absolute top-4 right-4 bg-zinc-900/80 hover:bg-red-600 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all hover:scale-110 z-20 cursor-pointer" title="Fechar Trailer">
                ✕
            </button>

            <!--Tag única com ID linkado ao JavaScript e classes fluidas! -->
            <iframe id="iframe-trailer" 
                    src="" 
                    class="w-full h-full" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
            </iframe>

        </div>
    </div>

      <!--Carrega primeiro o arquivo secreto com a chave -->
    <script src="config.js"></script>
    <!-- Conecta o seu arquivo de lógica local na raiz -->
    <script src="script.js"></script>
</body>
</html>
